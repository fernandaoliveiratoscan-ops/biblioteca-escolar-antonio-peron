{% extends "base.html" %}{% block content %}<h1>Empréstimos</h1><div class="subtitle">Registre a retirada de livros</div><div class="grid2"><form class="form" method="post"><label>Aluno</label><select name="aluno_id" required><option value="">Selecione o aluno</option>{% for a in alunos %}<option value="{{a.id}}">{{a.nome}} — {{a.turma}}</option>{% endfor %}</select><label>Livro</label><select name="livro_id" required><option value="">Selecione o livro</option>{% for l in livros %}<option value="{{l.id}}">{{l.titulo}} ({{l.disponivel}} disponível)</option>{% endfor %}</select><label>Data prevista para devolução</label><input type="date" name="data_prevista" required><br><br><button class="btn" type="submit">Confirmar empréstimo</button></form><div class="panel"><h2>Empréstimos ativos</h2><table><tr><th>Aluno</th><th>Livro</th><th>Devolução</th></tr>{% for e in emprestimos %}<tr><td>{{e.aluno}}</td><td>{{e.livro}}</td><td>{{e.data_prevista}}</td></tr>{% else %}<tr><td colspan="3">Nenhum empréstimo ativo.</td></tr>{% endfor %}</table></div></div>{% endblock %}
