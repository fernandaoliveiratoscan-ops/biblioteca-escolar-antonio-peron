{% extends "layout.html" %}{% block content %}<div class="topbar"><div><h1>Alunos</h1><div class="subtitle">Cadastre e gerencie os estudantes</div></div><a class="btn" href="{{url_for('novo_aluno')}}">+ Adicionar aluno</a></div><form method="get" class="topbar"><input class="search" name="busca" value="{{busca}}" placeholder="🔎 Pesquisar aluno"><button class="btn">Pesquisar</button></form><div class="panel"><table><tr><th>Matrícula</th><th>Nome</th><th>Turma</th><th>Ação</th></tr>{% for a in alunos %}<tr><td>{{a.matricula}}</td><td>{{a.nome}}</td><td>{{a.turma}}</td><td><form method="post" action="{{url_for('excluir_aluno',id=a.id)}}"><button class="btn btn-danger">Excluir</button></form></td></tr>{% else %}<tr><td colspan="4">Nenhum aluno encontrado.</td></tr>{% endfor %}</table></div>{% endblock %}
